bundle:
  name: earthquake-weather-pipeline

variables:
  catalog:
    description: Target Unity Catalog name
    default: workspace
  landing_path:
    description: Unity Catalog Volume path for landed JSON envelopes
    default: /Volumes/workspace/bronze/landing/

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/.bundle/${bundle.name}/${bundle.target}

resources:
  jobs:
    earthquake_pipeline_scheduled_run:
      name: "[Track A] Earthquake + Weather Pipeline"
      description: "Scheduled execution of Bronze/Silver/Gold Delta Lake transformations on Serverless compute"
      schedule:
        quartz_cron_expression: "0 0 */6 * * ?"
        timezone_id: "UTC"
        pause_status: PAUSED
      environments:
        - environment_key: serverless_standard_v6
          spec:
            client: "1"
      tasks:
        - task_key: run_notebook
          environment_key: serverless_standard_v6
          notebook_task:
            notebook_path: ./earthquake_pipeline_notebook.py
            base_parameters:
              catalog: ${var.catalog}
              landing_path: ${var.landing_path}
